# Per-OS capability smoke tests (docs/design-per-os-ci.md).
#
# Test each capability END TO END on ubuntu/macos/windows at ZERO privilege
# (userspace netstack, no TUN/admin, stock GitHub runners). Uses the
# Python Flask signaling backend (bundled with the repo) to pair two local
# filament daemons, then exercises real capabilities.
#
# "Green" = this CI is green on ALL three OSes, read from `gh pr checks`,
# NOT a local `cargo test` on Linux. This CI exists because local-Linux-green
# has repeatedly masked Windows-red.
#
# Build + smoke run in ONE job per OS. They used to be split (a `build` job that
# uploaded a binary artifact, and a `smoke` job that re-downloaded it), but
# `cargo test` re-unifies features across the harness dev-dependencies, so the
# smoke job rebuilt most of the graph anyway (~2.5 min) and the cross-job target
# cache restore invalidated fingerprints on top. The split paid for a whole
# extra runner plus an artifact round-trip and saved nothing. Building then
# testing in the SAME target dir keeps fingerprints valid, so the test step only
# compiles the harness delta. sccache (GHA backend, shared across workflows)
# still de-dupes the heavy shared-flag dependency compiles with test.yml.

name: Capability CI

on:
  push:
    branches: [main]        # deliberately UNfiltered: main pushes keep caches warm
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "frontend/**"
      - "showcase/**"
      - "experiments/**"
      - "lab/**"
  workflow_dispatch: {}

concurrency:
  group: cap-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"

jobs:
  capability-smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # #26 (resolved): macOS ARM64 required check. The root cause was webrtc-rs
    # gathering ZERO loopback host candidates on ARM64 macOS. With the
    # loopback-only filter enabled, only unusable srflx candidates remained and
    # ICE never nominated a pair. The fix: disable the IP filter on macOS so the
    # runner's bridge IP (192.168.64.x) provides a host candidate.
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install flask==3.1.0 flask-socketio==5.5.1 flask-cors==5.0.1 eventlet==0.39.0

      # direct::bind_endpoint asks for SO_RCVBUF at 8 MiB, then 4, then 1, and
      # returns Err if all three fail. Option A has already dropped the WebRTC
      # link by the time that Err propagates, so a platform that refuses all
      # three sizes loses the fast path AND its fallback. macOS caps socket
      # buffers via kern.ipc.maxsockbuf far below what Linux grants by default,
      # which makes it the platform where this can actually fire.
      #
      # Reported on the runner image that exhibits the failure, which is better
      # evidence than any developer machine. Never fails the job: this is a
      # measurement, not a gate.
      - name: Probe UDP socket buffer limits (diagnostic)
        continue-on-error: true
        shell: bash
        run: |
          echo "--- kernel socket buffer ceiling ---"
          sysctl kern.ipc.maxsockbuf 2>/dev/null \
            || cat /proc/sys/net/core/rmem_max 2>/dev/null \
            || echo "(no ceiling reported on this platform)"
          echo "--- what SO_RCVBUF actually grants, the sizes bind_endpoint tries ---"
          python3 - <<'PY'
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          for mib in (8, 4, 1):
              want = mib * 1024 * 1024
              try:
                  s.setsockopt(socket.SOL_SOCKET, socket.SO_RCVBUF, want)
                  got = s.getsockopt(socket.SOL_SOCKET, socket.SO_RCVBUF)
                  print(f"{mib} MiB: OK (kernel granted {got} bytes)")
              except OSError as e:
                  print(f"{mib} MiB: FAILED {e}")
          s.close()
          PY

      # direct-QUIC candidates EXCLUDE loopback (direct.rs:433 filters
      # is_loopback), so two peers on one host must reach each other via the
      # host's OWN interface address: a UDP hairpin. The local-tcp path does not
      # need this, it dials 127.0.0.1 explicitly, which is a candidate mechanism
      # for macOS completing transfers over "direct over lo" while never once
      # completing direct-QUIC.
      #
      # Linux baseline, measured: hairpin works, so this is not the blocker there.
      - name: Probe same-host UDP hairpin (diagnostic)
        continue-on-error: true
        shell: bash
        run: python3 experiments/py/hairpin_probe.py

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target dir (deps + fingerprints)
        uses: actions/cache@v4
        with:
          path: |
            cli/target/release/.fingerprint/
            cli/target/release/deps/
            cli/target/release/build/
            cli/target/release/libfilament_cli*
          key: ${{ runner.os }}-target-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Build filament (test-hooks)
        working-directory: cli
        run: cargo build --features test-hooks --release
        env:
          RUST_MIN_STACK: 8388608
          CMAKE_C_COMPILER_LAUNCHER: ${{ runner.os != 'Windows' && 'sccache' || '' }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ runner.os != 'Windows' && 'sccache' || '' }}
          CC: ${{ runner.os != 'Windows' && 'sccache cc' || '' }}
          CXX: ${{ runner.os != 'Windows' && 'sccache c++' || '' }}

      - name: Codesign binary (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - cli/target/release/filament

      - name: Run capability harness
        working-directory: cli
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cargo test --features test-hooks --release --test capability_harness \
              -- --nocapture --test-threads=1 2>&1 | tee /tmp/harness-macos.log
          else
            cargo test --features test-hooks --release --test capability_harness \
              -- --nocapture --test-threads=1
          fi
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: trace
          FILAMENT_WORKTREE: ${{ github.workspace }}
          RUST_MIN_STACK: 8388608
          FILAMENT_LOG: trace
          FILAMENT_DIRECT_PER_OS: ${{ runner.os == 'macOS' && '0' || '1' }}
          FILAMENT_DIRECT_LOOPBACK_ONLY: ${{ runner.os == 'macOS' && '0' || '1' }}   # macOS ARM64 webrtc-rs gathers no loopback host candidates; allow all interfaces so the runner's bridge IP provides a candidate
          CMAKE_C_COMPILER_LAUNCHER: ${{ runner.os != 'Windows' && 'sccache' || '' }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ runner.os != 'Windows' && 'sccache' || '' }}
          CC: ${{ runner.os != 'Windows' && 'sccache cc' || '' }}
          CXX: ${{ runner.os != 'Windows' && 'sccache c++' || '' }}
        timeout-minutes: 15

      - name: Upload harness log (macOS)
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-macos-log
          path: /tmp/harness-macos.log
          if-no-files-found: warn

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  # Security gate: confirm capability_harness is ABSENT in release builds.
  # The test-hooks feature enables signaling-bypass paths; a release binary
  # that accidentally ships test-hooks is a security hole.
  release-no-test-hooks:
    name: release build (no test-hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Assert test-hooks NOT in release build
        working-directory: cli
        run: |
          cargo build --release 2>&1
          # The test must NOT compile in release builds (cfg gate).
          # cargo test --no-run will compile it regardless, but then `cargo test`
          # will report 0 tests (all functions cfg'd out).
          out=$(cargo test --release --test capability_harness 2>&1)
          echo "$out"
          echo "$out" | grep -q "0 passed; 0 failed" || { echo "ERROR: test-hooks test compiled in release build!"; exit 1; }
        env:
          RUST_BACKTRACE: 1
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          CC: sccache cc
          CXX: sccache c++

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
