name: Warning Ratchet

on:
  push:
    branches: [main, feat/capability-layer]
  pull_request:
    branches: [main, feat/capability-layer]

jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and capture warning count
        id: build
        run: |
          set -o pipefail
          cd cli
          # `cargo check | grep ... || true` used to swallow a COMPILE FAILURE:
          # grep finds no warnings, `|| true` hides the failure, the count is 0,
          # and 0 <= baseline so the ratchet passes. A tree that does not build
          # scored a perfect warning count. Capture the status explicitly.
          CARGO_PROFILE_RELEASE_LTO=false cargo check -j2 2>&1 | tee /tmp/check.log || CHECK_FAILED=1
          if [ "${CHECK_FAILED:-0}" = "1" ]; then
            echo "::error::cargo check FAILED; the warning count below is meaningless."
            tail -40 /tmp/check.log
            exit 1
          fi
          grep "^warning:" /tmp/check.log > /tmp/warnings.txt || true
          printf '%d' "$(wc -l < /tmp/warnings.txt)" > /tmp/warning-count
          echo "current=$(cat /tmp/warning-count)" >> $GITHUB_OUTPUT

      - name: Ratchet check
        run: |
          # A MISSING baseline used to become 9999, so every count passed and
          # the gate silently stopped gating. Absence of the baseline is a
          # broken gate, not a permissive one.
          if [ ! -f .github/warning-baseline ]; then
            echo "::error::.github/warning-baseline is missing; the ratchet cannot gate without it."
            exit 1
          fi
          BASELINE=$(cat .github/warning-baseline)
          CURRENT=${{ steps.build.outputs.current }}
          echo "baseline=$BASELINE current=$CURRENT"
          if [ "$CURRENT" -gt "$BASELINE" ]; then
            echo "::error::Warning count increased from $BASELINE to $CURRENT. Diff against baseline:"
            echo "Revert the change that introduced the warning, or update the baseline intentionally."
            exit 1
          fi
          if [ "$CURRENT" -lt "$BASELINE" ]; then
            echo "::notice::Warning count decreased from $BASELINE to $CURRENT. Update the baseline to ratchet down."
          fi
          echo "OK: warning count $CURRENT <= baseline $BASELINE"
