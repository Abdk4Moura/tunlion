# Test + cross-compile gate on every push/PR.
#
# `cargo test` runs the full suite, including the userspace L3 netstack interop
# tests (src/tun/netstack.rs): ICMPv6 echo + malformed-input fuzz, a two-stack
# dial->listen->byte-roundtrip, TCP survival through ~1-in-7 packet loss, and many
# concurrent connections. These are the netstack<->netstack interop + resilience
# proofs and need NO kernel TUN, so they run on a stock runner. The cross-build job
# confirms the smoltcp netstack still compiles on every shipped target (musl,
# macOS, Windows), not just at release time.

name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: cargo test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - name: Test
        working-directory: cli
        run: cargo test --release
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
      # `cargo test` in cli/ runs the CLI package's tests only: a path
      # dependency is BUILT, never tested. Every crate under crates/ therefore
      # had unit tests that no CI job ran, so they could rot silently. Named
      # explicitly rather than globbed so adding a crate is a deliberate act
      # that shows up in review.
      - name: Test the local crates
        run: |
          set -e
          for c in filament-signal filament-cap filament-id filament-overlay \
                   filament-fleet filament-pair filament-proto filament-transfer; do
            if [ -f "crates/$c/Cargo.toml" ]; then
              echo "::group::$c"
              cargo test --release --manifest-path "crates/$c/Cargo.toml"
              echo "::endgroup::"
            fi
          done
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          CC: sccache cc
          CXX: sccache c++
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  test-windows:
    name: cargo test (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - name: Test
        working-directory: cli
        shell: bash
        run: cargo test --release
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  cross-build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            features: "--features static"
            use_sccache_c: false
          - target: aarch64-apple-darwin
            os: macos-latest
            features: ""
            use_sccache_c: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            features: ""
            use_sccache_c: false
    steps:
      - uses: actions/checkout@v4
      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - name: Build (with C caching)
        if: matrix.use_sccache_c
        working-directory: cli
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features }}
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          CC: sccache cc
          CXX: sccache c++
      - name: Build (no C caching)
        if: ${{ !matrix.use_sccache_c }}
        working-directory: cli
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *windows-msvc* ]]; then
            export RUSTFLAGS="${RUSTFLAGS:-} -C target-feature=+crt-static"
          fi
          cargo build --release --target ${{ matrix.target }} ${{ matrix.features }}
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      # Keep the binary, but only when someone asked for it. Debugging a report
      # from a real machine needs the exact bytes that machine ran, and a
      # version string cannot identify a build: every candidate for a release
      # reports the same version as the release. This job already produces the
      # shipping artifact for each target, so handing one out costs a step and
      # removes the reason to test a locally cross-compiled binary whose
      # toolchain differs from the released one.
      #
      # Manual dispatch only. On every push and PR this would add ~90MB across
      # three targets, and on a public repo the result is an unsigned
      # pre-release binary sitting downloadable on the Actions tab, where it can
      # be mistaken for a release. Ask for a test build with
      #   gh workflow run test.yml --ref <branch>
      - name: Publish binary
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: filament-${{ matrix.target }}
          path: |
            cli/target/${{ matrix.target }}/release/filament
            cli/target/${{ matrix.target }}/release/filament.exe
          if-no-files-found: error
          retention-days: 7

  # Interactive flows through a real pty, including ConPTY on Windows.
  #
  # Manual dispatch and non-gating on purpose. These cells currently include the
  # #197 discriminator, whose Ctrl-C case is EXPECTED to fail on Windows: that
  # failure is the finding. Gating on it would turn a diagnosis into a blocked
  # board, and marking it green would hide the bug we are trying to name.
  # Read the two cells together, per the header of cli/tests/pty_flows.rs.
  pty-flows:
    name: pty flows (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Interactive cells
        working-directory: cli
        shell: bash
        run: cargo test --release --test pty_flows -- --ignored --nocapture --test-threads=1
