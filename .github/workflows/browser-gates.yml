# The frontend browser gates. These exist because a clean build is not a correct
# UI: every one of them drives a real browser against the real components. The
# webshell-scroll gate runs in both Chromium and WebKit (Safari's engine).
#
# They ran nowhere until now. All four were dead on hardcoded absolute paths
# into worktrees that had been reaped (#250), and nothing in CI invoked them
# even when they worked (#249). A gate that runs only when somebody remembers is
# not enforcement, and this repo's standing rule is that frontend changes are
# verified in a browser before they ship.
#
# Only the two that pass are wired. p1-relay-rebuild and p5-upgrade-prober
# assert with regexes over SOURCE TEXT and are excluded on purpose: making them
# green would mean updating the patterns, which restores the appearance of
# coverage without restoring any. See #250. Wire them here once they assert
# behaviour instead.
name: Browser gates

on:
  push:
    branches: [main, "integration/**"]
    paths:
      - "frontend/**"
      - "cli/dashboard-dist/**"
      - ".github/workflows/browser-gates.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "cli/dashboard-dist/**"
      - ".github/workflows/browser-gates.yml"

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Redis registry is the multi-replica path; exercise its atomic Lua
    # alongside the in-memory registry so the two ownership implementations
    # cannot silently drift apart.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # The pure protocol and state tests (plain node, no browser). wire.test
      # pins the frame layout to the CLI's; it existed but ran nowhere, which
      # is how the browser kept a 4-byte header for months after the CLI moved
      # to 12.
      - name: Frontend unit tests
        working-directory: frontend
        run: |
          set -e
          for f in $(find src test -name '*.test.mjs' | sort); do
            echo "== $f"; node "$f"
          done

      # `tunlion dashboard` serves a bundle committed inside the cli crate
      # (it ships to crates.io with the binary). Rebuild it from source and
      # fail if the committed copy differs, so the page the CLI serves is
      # always the page this source describes.
      - name: Dashboard bundle matches its source
        working-directory: frontend
        run: |
          set -e
          node node_modules/.bin/vite build --config vite.dashboard.config.js
          git diff --exit-code --stat -- ../cli/dashboard-dist || {
            echo "::error::cli/dashboard-dist is stale: run 'npx vite build --config vite.dashboard.config.js' in frontend/ and commit it"; exit 1; }
          test -z "$(git status --porcelain -- ../cli/dashboard-dist)"

      - name: Install Chromium and WebKit
        working-directory: frontend
        # WebKit is Safari's engine. It is not a physical iPad; the webshell
        # gate states that boundary and uses an iPad touch viewport/UA.
        run: npx playwright install --with-deps chromium webkit

      # The dashboard's screens against a stand-in API (the real daemon is
      # covered by cli/tests/dashboard-gates.sh and the lab run).
      - name: dashboard-ui
        run: node frontend/tests/dashboard-ui.spec.cjs

      # pake-ux drives the real backend, so it needs the Python side present.
      # Versions match capability-ci.yml so the two jobs cannot drift apart.
      - name: Install backend deps
        run: pip install flask==3.1.0 flask-socketio==5.5.1 flask-cors==5.0.1 eventlet==0.39.0

      # pake-ux asserts the built app talks to its own origin, so the dist must
      # be built WITHOUT a production API base. The gate checks this and says so.
      - name: Build a same-origin dist
        working-directory: frontend
        env:
          VITE_TUNLION_API: ""
        run: npm run build

      - name: relay-honesty
        run: node frontend/tests/relay-honesty.spec.cjs

      # Web-shell readiness: the browser must announce direct:false BEFORE any
      # SDP. Without it a direct-first CLI waits out its QUIC budget and the
      # web client sits on "connecting". The Rust unit test covers the cancel.
      - name: transport-hint
        run: node frontend/tests/transport-hint.spec.cjs

      - name: pake-ux
        env:
          TUNLION_TEST_VENV: python3
        run: node frontend/tests/pake-ux.spec.cjs

      # The new screens: one code box (Receive first), buttons only for access
      # held, keyboard reach and focus rings, the phone full-bleed shell, and a
      # code in the link's #fragment. Harness for the screens, the real built
      # app for the fragment.
      - name: browser-ui
        env:
          TUNLION_TEST_VENV: python3
        run: node frontend/tests/browser-ui.spec.cjs

      # The local device name and connected peer name are visible, a chosen
      # name replaces the generated default, and a superseded tab explains
      # itself without a reset/clear-data instruction. Chromium + WebKit iPad.
      - name: peer-identity
        run: node frontend/tests/peer-identity.spec.cjs

      # Generation-safe reload: a normal reload supersedes the old signaling
      # session, a late close from that generation is ignored, two tabs for one
      # device resolve to one live session, and rename relabels the same sid.
      # Real Flask relay + Chromium and WebKit iPad (each in its own process).
      - name: peer-reload
        env:
          TUNLION_TEST_VENV: python3
        run: node frontend/tests/peer-reload.spec.cjs

      # The relay's generation/rename/close semantics, independent of a browser.
      - name: backend session generation
        run: python -m unittest backend.tests.test_session_generation

      - name: backend session generation (Redis parity)
        env:
          FIL_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: python -m unittest backend.tests.test_session_generation_redis

      # The shell outlives its link: a reattach sends resume_from (exactly the
      # bytes the terminal showed), the bar says reconnecting while the link is
      # down, and no line arrives twice or goes missing. Fake device session that
      # replays like the CLI acceptor.
      - name: pty-reattach
        run: node frontend/tests/pty-reattach.spec.cjs

      # Touch scrolling is mode-aware: ordinary shells scroll local history,
      # mouse-reporting TUIs (including partial ones still in the normal buffer)
      # get xterm-encoded wheel reports at the touched cell, and the alternate
      # screen without mouse reporting uses xterm's cursor-key fallback. Also
      # gates taps/horizontal/multi-touch and the mobile IME path.
      - name: webshell-scroll (Chromium)
        run: node frontend/tests/webshell-scroll.spec.cjs

      # Same spec, Safari's engine, iPad touch viewport/user-agent. The spec
      # fails honestly if WebKit offers no synthetic Touch/TouchEvent API; it
      # never rewrites a touch gesture as a mouse/key gesture to go green.
      - name: webshell-scroll (WebKit / iPad)
        env:
          WEBSHELL_BROWSER: webkit
        run: node frontend/tests/webshell-scroll.spec.cjs

      # Screenshots are the evidence a browser actually rendered, rather than the
      # harness reporting on itself. Keep them when a gate fails.
      #
      # Two settings here are load-bearing and both defaults are wrong for this.
      #
      # upload-artifact skips hidden files by DEFAULT, and `.relay-shots` is a
      # dotted directory, so it was skipped even with the path named exactly.
      # Measured twice: the gate logged both screenshots, the step went green,
      # and the run produced no artifact at all. `include-hidden-files` is what
      # actually fixes it; naming the path was not enough.
      #
      # And `if-no-files-found` must be `error`. Whatever the reason an upload
      # ends up empty, a step that reports success while uploading nothing turns
      # the absence of evidence into the appearance of it. These screenshots are
      # the only proof a browser rendered rather than the harness reporting on
      # itself, so their absence should be loud.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-gate-screenshots
          path: frontend/tests/.relay-shots/
          include-hidden-files: true
          if-no-files-found: error
