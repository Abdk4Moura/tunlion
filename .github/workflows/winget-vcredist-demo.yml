# Demo for winget-pkgs PR #384634 (Abdk4Moura.Filament 0.1.0).
#
# Reviewer @Trenly observed `filament` failing to launch after `winget install`
# on a clean Windows machine ("VCRUNTIME140.dll was not found"). This workflow
# reproduces that on GitHub-hosted Windows and proves the fix is the VC++
# 2015-2022 Redistributable -- i.e. the manifest should declare a dependency on
# Microsoft.VCRedist.2015+.x64.
#
#   job 1 (inspect)   : prove the shipped 0.1.0 binary imports VCRUNTIME140.dll
#   job 2 (clean-room): inside a pristine Windows Server Core container (no
#                       VCRedist) the binary fails with STATUS_DLL_NOT_FOUND
#                       (0xC0000135), then runs cleanly once vc_redist.x64.exe
#                       is installed.

name: winget-vcredist-demo

on:
  push:
    branches: [winget-vcredist-demo]
  workflow_dispatch:

env:
  ZIP_URL: https://github.com/Abdk4Moura/filament/releases/download/cli-v0.1.0/filament-x86_64-pc-windows-msvc.zip

jobs:
  inspect:
    name: Prove binary imports VCRUNTIME140.dll
    runs-on: windows-latest
    steps:
      - name: Download & extract the released 0.1.0 zip
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:ZIP_URL -OutFile filament.zip
          Expand-Archive -Path filament.zip -DestinationPath bin -Force
          Get-ChildItem bin
      - name: Set up MSVC dev tools (dumpbin)
        uses: ilammy/msvc-dev-cmd@v1
      - name: dumpbin /dependents filament.exe
        shell: pwsh
        run: |
          $out = & dumpbin /dependents bin\filament.exe | Out-String
          Write-Host $out
          if ($out -match 'VCRUNTIME140') {
            Write-Host "::notice::CONFIRMED - filament.exe dynamically imports the VC++ runtime (VCRUNTIME140*.dll)."
          } else {
            Write-Host "::error::Did not find VCRUNTIME140 in the import table."
            exit 1
          }

  clean-room:
    name: Reproduce failure & prove VCRedist fixes it
    runs-on: windows-2022
    steps:
      - name: Checkout (for clean-room.ps1)
        uses: actions/checkout@v4
      - name: Download & extract the released 0.1.0 zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path work\bin | Out-Null
          Invoke-WebRequest -Uri $env:ZIP_URL -OutFile filament.zip
          Expand-Archive -Path filament.zip -DestinationPath work\bin -Force
          Copy-Item .github\workflows\clean-room.ps1 work\clean-room.ps1
          Get-ChildItem work\bin
      - name: Pre-download VCRedist on the host (no in-container network needed)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile work\vc_redist.x64.exe
          Get-Item work\vc_redist.x64.exe | Select-Object Name,Length
      - name: Run the clean-room repro+fix inside Server Core
        shell: pwsh
        run: |
          $img = "mcr.microsoft.com/windows/servercore:ltsc2022"
          docker pull $img
          docker run --rm -v "${PWD}\work:C:\w" -w "C:\w" $img `
            powershell -ExecutionPolicy Bypass -File C:\w\clean-room.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
