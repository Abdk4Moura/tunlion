# Build and attach filament CLI binaries to a GitHub release.
# Trigger: push a tag like cli-v0.1.0. The release process is exactly:
#
#     git tag cli-vX.Y.Z && git push origin cli-vX.Y.Z
#
# Everything else — matrix builds, SHA256SUMS, provenance attestation, the
# release itself — happens here. The curl|sh installer
# (https://filament.autumated.com/install), `filament update`, the Homebrew
# tap, and the winget manifests all consume these exact artifact names:
#     filament-<target>.tar.gz   (unix)   /  filament-<target>.zip (windows)
#     SHA256SUMS
# Ledger C16 / gap G-e: docs/cli-resilience.md.

name: cli-release

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: write
  id-token: write # provenance attestation
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            features: "--features static"
          - target: aarch64-apple-darwin
            os: macos-latest
            features: ""
          # Intel build cross-compiled from the arm64 runner: macos-13 (the
          # last Intel runner) is being retired and queues for ages.
          - target: x86_64-apple-darwin
            os: macos-latest
            features: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            features: ""
    steps:
      - uses: actions/checkout@v4
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - name: Build
        working-directory: cli
        shell: bash
        run: |
          export FILAMENT_BUILD_SHA="${GITHUB_SHA::7}"
          export FILAMENT_BUILD_DATE="$(date -u +%Y-%m-%d)"
          # Statically link the MSVC CRT so the Windows binary is self-contained
          # and doesn't need the VC++ Redistributable (no VCRUNTIME140.dll at
          # runtime), mirroring the fully-static musl Linux build.
          if [[ "${{ matrix.target }}" == *windows-msvc* ]]; then
            export RUSTFLAGS="${RUSTFLAGS:-} -C target-feature=+crt-static"
          fi
          cargo build --release --target ${{ matrix.target }} ${{ matrix.features }}
      - name: Guard - no dev-debug profiling in the release binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="cli/target/${{ matrix.target }}/release/filament"
          # Per-chunk/per-frame profiling logging must stay compile-stripped (behind
          # the `debug-logs` feature) and MUST NOT ship in a default release build.
          # If any marker is present, a dev-debug log leaked - fail the release.
          if strings "$BIN" | grep -nE 'FILAMENT_TRACE_THROUGHPUT|\[TRACE stream_one|\[TRACE recv|\[TRACE direct|\[TRACE dc'; then
            echo "::error::dev-debug profiling logging leaked into the release binary"; exit 1
          fi
          echo "release binary clean of dev-debug profiling logging"
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *musl* ]]; then
            file "cli/target/${{ matrix.target }}/release/filament" | grep -qi "static" || { echo "not static!"; exit 1; }
          fi
          mkdir -p out
          cp "cli/target/${{ matrix.target }}/release/filament" out/
          tar -C out -czf "filament-${{ matrix.target }}.tar.gz" filament
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Bundle wintun.dll (WireGuard LLC's signed userspace TUN driver) beside
          # filament.exe so the L3 overlay works on Windows out of the box; the CLI
          # loads it from its own directory. amd64 build for x86_64-pc-windows-msvc.
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "cli/target/${{ matrix.target }}/release/filament.exe" out/
          # Supply-chain integrity: pin the archive to its known SHA256 before
          # extracting anything, then require a valid WireGuard LLC Authenticode
          # signature on the DLL itself. Either check failing aborts the release.
          $expected = "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile wintun.zip
          $actual = (Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "wintun.zip SHA256 mismatch: got $actual expected $expected" }
          Expand-Archive -Path wintun.zip -DestinationPath wintun-extract
          $dll = "wintun-extract/wintun/bin/amd64/wintun.dll"
          $sig = Get-AuthenticodeSignature $dll
          if ($sig.Status -ne "Valid") { throw "wintun.dll Authenticode not Valid: $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch "WireGuard LLC") { throw "wintun.dll not signed by WireGuard LLC: $($sig.SignerCertificate.Subject)" }
          Copy-Item $dll out/
          Compress-Archive -Path "out/*" -DestinationPath "filament-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: |
            filament-*.tar.gz
            filament-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The release job did not check out the repo, because it only ever
      # assembled artifacts. It does now, so the notes can be built FROM
      # CHANGELOG.md instead of being a static template that cannot mention
      # what changed.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
      - name: Checksums
        run: |
          sha256sum filament-* > SHA256SUMS
          cat SHA256SUMS
      - name: Provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            filament-*
            SHA256SUMS
      # WHY THIS EXISTS
      #
      # The release body below used to be a static install + quick-start
      # template with no reference to CHANGELOG.md. So a change could be
      # written up correctly in the changelog and still be invisible in the
      # release notes, which is what a user actually reads when `filament
      # update` or winget offers them a new version.
      #
      # That was found on 2026-08-04 while landing a security entry under
      # [Unreleased]. The entry was correct, merged, and would have reached
      # nobody. Writing the entry and publishing the entry are two different
      # facts and only one of them was happening.
      #
      # If the changelog has no section for this tag, that is stated LOUDLY in
      # the published notes rather than passed over. A missing entry is worth
      # seeing; silence is what let a deferral sit unread for four days.
      - name: Build release notes from CHANGELOG.md
        run: |
          VER="${GITHUB_REF_NAME#cli-v}"
          extract() {
            awk -v want="$1" '
              $0 ~ "^## \\[" want "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
          }
          SECTION="$(extract "$VER")"
          if [ -z "$(printf '%s' "$SECTION" | tr -d '[:space:]')" ]; then
            UNREL="$(extract "Unreleased")"
            if [ -n "$(printf '%s' "$UNREL" | tr -d '[:space:]')" ]; then
              {
                echo "> **Note:** CHANGELOG.md has no \`## [$VER]\` section, so the"
                echo "> notes below come from its \`[Unreleased]\` section. Rename that"
                echo "> heading to \`[$VER]\` and the next release picks it up directly."
                echo
                printf '%s\n' "$UNREL"
              } > notes-head.md
            else
              {
                echo "> **Note:** CHANGELOG.md has no entry for \`$VER\` and no"
                echo "> \`[Unreleased]\` section. These notes describe how to install"
                echo "> this version, not what changed in it."
              } > notes-head.md
            fi
          else
            printf '%s\n' "$SECTION" > notes-head.md
          fi
          echo "--- release notes head ---"
          cat notes-head.md
      - name: Assemble the full release body
        run: |
          {
            cat notes-head.md
            echo
            cat .github/release-body.md
          } > release-notes.md
          echo "--- full body ---"
          cat release-notes.md
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          # A tag with a hyphen (cli-v0.2.1-beta.1) is a PRERELEASE: GitHub
          # hides it from /releases/latest, and the installer + self-update
          # skip it unless explicitly opted in (FILAMENT_CHANNEL=beta /
          # `filament update --beta`).
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
          files: |
            filament-*
            SHA256SUMS
