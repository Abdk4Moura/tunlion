# Revocation gates: a revoked certificate must end access that is ALREADY OPEN.
#
# These three scripts were written with the #235 fix (7548f8b, "a revoked peer
# loses a live shell and a live forward") and then never ran anywhere. #249
# measured the general case: no workflow invoked any `cli/tests/*-gates.sh`. So
# the repo's highest-severity guarantee, that revoke actually revokes, was
# defended entirely by tests nothing executed. This workflow is that omission
# closed for the revocation family.
#
# Each script carries its own controls, which is why they are worth running:
#   A   the session streams BEFORE the revoke      (positive control)
#   A2  a healthy session survives its own recheck (no-revoke control)
#   B/C the revoked session stops, and the denial REACHES the client
# A2 is the one that matters most. Without it a gate passes by closing
# everything always, which would "prove" revocation while breaking the product.
#
# fleet-cert-gates is the arm that asks the same question of a CERTIFIED
# device. The others pair their daemons with a hand-written shared secret, and
# such a link resolves no identity at all, so `cert_revoked` is false there
# whatever the product does: revoking a CERTIFICATE (rather than a grant) had
# no live coverage anywhere, only a unit matrix over fabricated inputs. That
# arm enrols through `add --for` / `join` and revokes with
# `revoke <device> --certificate`, and carries its own restore control so a
# broken link cannot masquerade as a revocation.
#
# Also carries forward-refusal-gates (#232/#268): the same question, asked of a
# peer that refuses an l2-open rather than one that revokes. It lives here
# because it is the same fixture family and the same property, what filament
# tells you when the far side says no. There was no gate for it at all, which is
# why #268 had to be found by hand across two machines.
#
# Linux only, deliberately. The mount arm needs FUSE, and the point here is to
# run the guarantee somewhere real rather than to matrix it.

name: Revoke Gates

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'cli/src/**'
      - 'cli/tests/*revoke-gates.sh'
      - 'cli/tests/ssh-ca-gates.sh'
      - 'cli/tests/exec-gates.sh'
      - 'cli/tests/sync-gates.sh'
      - 'cli/tests/fleet-cert-gates.sh'
      - 'cli/tests/shell-posture-gates.sh'
      - 'cli/tests/forward-refusal-gates.sh'
      - 'cli/tests/lib/fixture.sh'
      - 'backend/**'
      - '.github/workflows/revoke-gates.yml'
  workflow_dispatch: {}

concurrency:
  group: revoke-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"

jobs:
  revoke-gates:
    name: revoke gates (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install flask==3.1.0 flask-socketio==5.5.1 flask-cors==5.0.1 eventlet==0.39.0

      # The mount arm mounts a real FUSE filesystem and unmounts it in its trap.
      - name: Install FUSE
        run: sudo apt-get update && sudo apt-get install -y fuse3

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Build filament
        working-directory: cli
        run: cargo build --release

      # Every script is named explicitly and its gate count asserted. An exit
      # code alone is not enough: `bad` only increments a counter, so a script
      # that dies before reaching its gates, or one whose gates are skipped by a
      # branch, can still leave FAIL at 0. A monitor once called a CI run
      # finished on 3 of 13 checks for exactly this reason. Counting the PASS
      # lines is what makes "green" mean "the gates ran AND passed".
      - name: Run revocation gates
        env:
          FILAMENT_BIN: ${{ github.workspace }}/cli/target/release/filament
        run: |
          set -uo pipefail
          # Full paths, not bare names under a working-directory. The registry
          # checker (#249) decides "is this artifact wired into CI" by looking for
          # the artifact PATH in a workflow file, so a loop over `$g.sh` runs the
          # gates while leaving them indistinguishable from unwired ones. Wiring
          # that a machine cannot see is the thing #249 exists to catch.
          declare -A EXPECT=(
            [cli/tests/ssh-ca-gates.sh]=6
            [cli/tests/exec-gates.sh]=13
            [cli/tests/sync-gates.sh]=9
            # 23 = 22 gate slots + the RECON (post-restart link re-establishment)
            # verdict. AUTH-A keeps its slot while it is KNOWN-RED: the count
            # below includes KNOWN-RED lines, so a tracked failure can never make
            # the total look short and can never be silently dropped.
            [cli/tests/fleet-cert-gates.sh]=23
            [cli/tests/pty-revoke-gates.sh]=3
            [cli/tests/mount-revoke-gates.sh]=4
            [cli/tests/l2-revoke-gates.sh]=3
            [cli/tests/shell-posture-gates.sh]=3
            [cli/tests/forward-refusal-gates.sh]=5
          )
          rc=0
          for g in cli/tests/ssh-ca-gates.sh \
                   cli/tests/exec-gates.sh \
                   cli/tests/sync-gates.sh \
                   cli/tests/fleet-cert-gates.sh \
                   cli/tests/pty-revoke-gates.sh \
                   cli/tests/mount-revoke-gates.sh \
                   cli/tests/l2-revoke-gates.sh \
                   cli/tests/shell-posture-gates.sh \
                   cli/tests/forward-refusal-gates.sh; do
            echo "::group::$g"
            # Label the tree the gates actually run against: CI checks out
            # GitHub's MERGE ref (pull/N/merge) by default, so "CI ran sha X"
            # is a false premise unless it is printed. This cost a run.
            echo "gate tree: $(git rev-parse HEAD) ($g)"
            [ -x "$g" ] || { echo "MISSING or not executable: $g"; rc=1; echo "::endgroup::"; continue; }
            # The runner invokes this step with `bash -e`, so a bare
            # `out=$(...); code=$?` is a trap: a FAILING gate makes the
            # assignment itself fail, errexit kills the step before the next
            # line, and the gate's output is never printed -- red runs were
            # reported with an EMPTY group, which is the worst possible
            # property for a diagnostic harness. `|| code=$?` keeps the
            # failing status while suppressing errexit; `|| true` on the
            # count does the same for grep's exit 1 on zero matches.
            code=0
            out="$(bash "$g" 2>&1)" || code=$?
            echo "$out"
            echo "::endgroup::"
            got=$(printf '%s\n' "$out" | grep -cE '^(PASS|KNOWN-RED):' || true)
            want=${EXPECT[$g]}
            if [ "$code" -ne 0 ]; then
              echo "::error::$g exited $code"; rc=1
            elif [ "$got" -ne "$want" ]; then
              echo "::error::$g passed $got gates but $want were expected; a gate did not run"; rc=1
            else
              echo "$g: $got/$want gates passed"
            fi
          done
          exit $rc
