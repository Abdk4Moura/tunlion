# Dogfood: run one CI job whose payload and artifacts travel over tunlion.
#
# Dispatch only, from scripts/ci-dogfood.sh, which mints a single-use invitation,
# sets it as TUNLION_INVITE, and sends the payload once the device shows up.
#
# The box does NOT check out this repo and does NOT build tunlion. It downloads
# the binary from the last green `publish-edge` run and verifies its sha256, so
# the only things this job needs are a key and a payload. Nothing here accepts
# an arbitrary command string: the payload carries job.json and the steps run
# exactly its declared `cmd`.
name: ci-dogfood

on:
  workflow_dispatch:
    inputs:
      runner_name:
        description: "Name this box joins as (must match the invitation)"
        required: true
      host_name:
        description: "Owner device to send the bundle back to"
        required: true
        default: "dovm"
      payload_timeout_s:
        description: "How long to wait for the payload to arrive"
        required: false
        default: "300"

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-dogfood-${{ inputs.runner_name }}
  cancel-in-progress: true

jobs:
  job:
    name: job on ${{ inputs.runner_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # No checkout. The binary comes from a published edge build, hash-checked.
      - name: Fetch the tunlion binary (no repo, no build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "WORK=$RUNNER_TEMP/tunlion-work" >> "$GITHUB_ENV"
          api="repos/${GITHUB_REPOSITORY}/actions"
          run=$(gh api "$api/workflows/publish-edge.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')
          if [ -z "${run:-}" ] || [ "$run" = "null" ]; then
            echo "::error::no successful publish-edge run on main: dispatch one, or push a cli/crates change"
            exit 6
          fi
          id=$(gh api "$api/runs/${run}/artifacts" --jq '[.artifacts[] | select(.name=="tunlion-edge")][0].id')
          if [ -z "${id:-}" ] || [ "$id" = "null" ]; then
            echo "::error::publish-edge run $run has no tunlion-edge artifact"
            exit 6
          fi
          gh api "$api/artifacts/${id}/zip" > "$RUNNER_TEMP/tunlion.zip"
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -oq "$RUNNER_TEMP/tunlion.zip" -d "$RUNNER_TEMP/bin"
          ( cd "$RUNNER_TEMP/bin" && sha256sum -c SHA256SUMS )
          chmod +x "$RUNNER_TEMP/bin/tunlion"
          "$RUNNER_TEMP/bin/tunlion" --version
          echo "TUNLION_BIN=$RUNNER_TEMP/bin/tunlion" >> "$GITHUB_ENV"

      - name: Join and serve with one command
        env:
          # Read from the environment, not an argv and not a file: the key is
          # never echoed, never written by this job, and never visible in `ps`.
          TUNLION_AUTHKEY: ${{ secrets.TUNLION_INVITE }}
        run: |
          set -euo pipefail
          if [ -z "${TUNLION_AUTHKEY:-}" ]; then
            echo "::error::TUNLION_INVITE is not set; run scripts/ci-dogfood.sh, which mints it"
            exit 2
          fi
          # One command: `up` joins when it has no identity, then serves. The
          # box does not name itself; the owner named this invitation when
          # minting, and that name wins (renewal_lifecycle.rs:489).
          #
          # `up` has no --json (docs/ci-ux.md), so start it and then read
          # `status --json`, which is the machine-readable "is it up".
          "$TUNLION_BIN" up --detach --dir "$WORK" --no-interactive
          for i in $(seq 1 30); do
            if "$TUNLION_BIN" status --json >/dev/null 2>&1; then break; fi
            sleep 1
          done
          "$TUNLION_BIN" status --json

      - name: Wait for the job payload
        env:
          DEADLINE: ${{ inputs.payload_timeout_s }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          end=$(( $(date +%s) + DEADLINE ))
          while [ "$(date +%s)" -lt "$end" ]; do
            f=$(find "$WORK" -maxdepth 2 -type f -name 'payload-*.tar' -print -quit 2>/dev/null || true)
            if [ -n "${f:-}" ]; then
              echo "payload: $f"
              echo "PAYLOAD=$f" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "::error::no payload arrived within ${DEADLINE}s"
          exit 6

      - name: Run the declared job
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/job"
          tar -xf "$PAYLOAD" -C "$RUNNER_TEMP/job"
          cd "$RUNNER_TEMP/job"
          python3 - <<'PY'
          import json, subprocess, sys
          spec = json.load(open("job.json"))
          print("job:", spec.get("id"), "cmd:", spec.get("cmd"))
          p = subprocess.run(spec["cmd"], timeout=int(spec.get("timeout_s", 900)))
          print("exit:", p.returncode)
          sys.exit(p.returncode)
          PY
          test -f out.tar

      - name: Bundle the outputs with their hashes
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/job"
          sha256sum out.tar > out.sha256
          # One bundle: the artifact, its hash, and the job's own record.
          tar -cf bundle.tar out.tar out.sha256 build-info.txt
          sha256sum bundle.tar
          echo "BUNDLE=$RUNNER_TEMP/job/bundle.tar" >> "$GITHUB_ENV"

      - name: Send the bundle back over tunlion
        env:
          HOST_NAME: ${{ inputs.host_name }}
        run: |
          set -euo pipefail
          "$TUNLION_BIN" send "$BUNDLE" --to "$HOST_NAME" --timeout 600 --json
          echo "bundle sent to $HOST_NAME"

      - name: Keep it as a workflow artifact too (belt and braces)
        uses: actions/upload-artifact@v4
        with:
          name: ci-dogfood-${{ inputs.runner_name }}
          path: ${{ runner.temp }}/job/bundle.tar
          if-no-files-found: warn

      - name: Leave the mesh
        if: always()
        run: |
          "$TUNLION_BIN" down -y || true
