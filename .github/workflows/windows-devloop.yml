name: windows-devloop

# A leased, warm Windows runner for fast iteration. Dispatch it with a branch
# and a duration; it polls that branch and rebuilds only when the tip or the
# command file changes, so incremental cargo state and the warm target survive
# across iterations inside one job. Results are pushed to RESULTS_BRANCH after
# every iteration so they can be read while the job is still running.
# Not a merge gate: normal CI still decides.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to poll and test
        required: true
        default: ci/windows-devloop
      minutes:
        description: Lease duration in minutes (max 330)
        required: true
        default: "120"

concurrency:
  group: windows-devloop
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEVPUSH_RESULTS_BRANCH: ci/devloop-results

jobs:
  devloop:
    runs-on: windows-latest
    timeout-minutes: 340
    env:
      DEVPUSH_BRANCH: ${{ inputs.branch }}
      DEVPUSH_MINUTES: ${{ inputs.minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: win-devloop-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            win-devloop-

      - name: Loop
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $branch = $env:DEVPUSH_BRANCH
          $results = $env:DEVPUSH_RESULTS_BRANCH
          $deadline = (Get-Date).AddMinutes([int]$env:DEVPUSH_MINUTES)
          Write-Host "DEVPUSH lease start branch=$branch minutes=$($env:DEVPUSH_MINUTES)"
          $last = ""
          while ((Get-Date) -lt $deadline) {
            git fetch --depth=1 origin $branch 2>&1 | Out-Null
            git reset --hard FETCH_HEAD 2>&1 | Out-Null
            $sha = (git rev-parse --short HEAD).Trim()
            $cmd = "cargo check --workspace --all-targets --locked"
            if (Test-Path .devloop/cmd.txt) {
              $line = Get-Content .devloop/cmd.txt -TotalCount 1
              if ($line -and $line.Trim()) { $cmd = $line.Trim() }
            }
            if (Test-Path .devloop/stop) {
              Write-Host "DEVPUSH stop requested at $sha"
              break
            }
            $key = "$sha|$cmd"
            if ($key -ne $last) {
              Write-Host "DEVPUSH head=$sha"
              Write-Host "DEVCMD $cmd"
              $sw = [Diagnostics.Stopwatch]::StartNew()
              $out = cmd.exe /c "$cmd 2>&1"
              $code = $LASTEXITCODE
              $out | ForEach-Object { Write-Host $_ }
              $status = if ($code -eq 0) { "ok" } else { "fail" }
              $line = "DEVRESULT {0} code={1} secs={2} head={3} cmd={4}" -f $status, $code, [int]$sw.Elapsed.TotalSeconds, $sha, $cmd
              Write-Host $line
              $body = "head=$sha`ncmd=$cmd`n$line`n`n" + ($out -join "`n")
              $tmp = Join-Path $env:RUNNER_TEMP "devloop-results"
              if (-not (Test-Path $tmp)) {
                git clone --depth=1 "https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY" $tmp 2>&1 | Out-Null
              }
              if (Test-Path $tmp) {
                Push-Location $tmp
                git checkout -B $results 2>&1 | Out-Null
                Set-Content -Path "last.log" -Value $body
                git add last.log 2>&1 | Out-Null
                git -c user.name=devloop -c user.email=devloop@local commit -q -m "devloop: $sha $status" 2>&1 | Out-Null
                git push -f origin $results 2>&1 | Out-Null
                Pop-Location
              }
              $last = $key
            }
            Start-Sleep -Seconds 15
          }
          Write-Host "DEVPUSH lease end"
