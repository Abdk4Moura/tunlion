name: Android app

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "android/**"
      - "cli/**"
      - "crates/**"
      - ".github/workflows/android-app.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "cli/**"
      - "crates/**"
      - ".github/workflows/android-app.yml"

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: x86_64-linux-android
            abi: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: app-core-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - run: |
          rustup target add ${{ matrix.target }}
          cargo install cargo-ndk --locked --version 4.1.2
      - name: Build the shared core from this app revision
        working-directory: crates/tunlion-core
        env:
          # Native artifacts and generated bindings must come from this checkout.
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk --platform 26 -t ${{ matrix.abi }} build --release --locked --lib
          mkdir -p "$GITHUB_WORKSPACE/android-core"
          cp "$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/libtunlion_core.so" \
            "$GITHUB_WORKSPACE/android-core/libtunlion_core.so"
      - uses: actions/upload-artifact@v4
        with:
          name: app-core-${{ matrix.abi }}
          path: android-core/libtunlion_core.so
          if-no-files-found: error
  bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: app-bindings-${{ hashFiles('Cargo.lock') }}
      - name: Generate same-revision Kotlin bindings
        working-directory: crates/tunlion-core
        run: |
          cargo build --release --locked --lib --config 'profile.release.strip=false'
          cargo run --locked --features cli --bin uniffi-bindgen -- \
            generate --library ../../target/release/libtunlion_core.so \
            --language kotlin --out-dir kotlin
      - uses: actions/upload-artifact@v4
        with:
          name: app-core-kotlin
          path: crates/tunlion-core/kotlin
          if-no-files-found: error
  build:
    needs: [core, bindings]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-core-arm64-v8a
          path: android/app/src/main/jniLibs/arm64-v8a
      - uses: actions/download-artifact@v4
        with:
          name: app-core-x86_64
          path: android/app/src/main/jniLibs/x86_64
      - uses: actions/download-artifact@v4
        with:
          name: app-core-kotlin
          path: android/app/src/main/java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Reuse preview signing key
        uses: actions/cache@v4
        with:
          path: android/.signing/preview.keystore
          key: android-preview-signing-v2
      - name: Prepare preview signing key
        run: |
          mkdir -p android/.signing
          if [ ! -f android/.signing/preview.keystore ]; then
            keytool -genkeypair -keystore android/.signing/preview.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Assert the APK packages only the shared native core
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          entries="$(unzip -Z1 "$apk")"
          if printf '%s\n' "$entries" | grep -Eq '(^|/)libtunlion_cli\.so$'; then
            echo "The APK must not package a CLI executable." >&2
            exit 1
          fi
          if printf '%s\n' "$entries" | grep -q '^assets/'; then
            echo "The APK must not package executable assets." >&2
            exit 1
          fi
          printf '%s\n' "$entries" | grep -Eq '(^|/)lib/(arm64-v8a|x86_64)/libtunlion_core\.so$'
      - name: Record exact source and artifact checksums
        run: |
          git rev-parse HEAD > android/app/build/outputs/apk/SOURCE_HEAD
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > android/app/build/outputs/apk/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tunlion-android-provenance
          path: |
            android/app/build/outputs/apk/SOURCE_HEAD
            android/app/build/outputs/apk/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tunlion-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: tunlion-android-acceptance
          path: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
  emulator:
    name: Native Compose client acceptance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tunlion-android-debug
          path: app-apk
      - uses: actions/download-artifact@v4
        with:
          name: tunlion-android-acceptance
          path: test-apk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install signaling fixture dependencies
        run: pip install flask==3.1.0 flask-socketio==5.5.1 flask-cors==5.0.1 eventlet==0.39.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: app-native-peer-${{ hashFiles('Cargo.lock') }}
      - name: Build desktop reference peer only
        run: cargo build --release --locked -p tunlion --bin tunlion
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash android/acceptance/native_app.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-client-acceptance-results
          path: android/acceptance/results
          if-no-files-found: warn
