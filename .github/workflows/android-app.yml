name: Android app

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Native identity core source (PR 467)
        uses: actions/checkout@v4
        with:
          ref: 0a5a0b0facaf5d33ad84427b5dd560df65b5deb1
          path: native-source
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native-source/crates/tunlion-core/target
          key: app-bindings-0a5a0b0-v1
      - name: Generate Kotlin binding from the pinned core
        working-directory: native-source/crates/tunlion-core
        run: |
          cargo build --release --locked --lib
          cargo run --locked --features cli --bin uniffi-bindgen -- generate \
            --library target/release/libtunlion_core.so --language kotlin \
            --out-dir ../../../android/app/build/generated/uniffi
      - name: ARM64 native core from the same commit
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38928819381
          name: tunlion-core-aarch64-linux-android
          path: android/app/src/main/jniLibs/arm64-v8a
      - name: x86 native core from the same commit
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38928819381
          name: tunlion-core-x86_64-linux-android
          path: android/app/src/main/jniLibs/x86_64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Reuse preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-preview-signing-v1
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tunlion-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
