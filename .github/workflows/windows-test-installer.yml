name: windows-test-installer

on:
  push:
    branches: [win-test-installer]

permissions:
  contents: read
  actions: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout access integration source
        uses: actions/checkout@v4
        with:
          ref: integration/access-shell-cli
          path: access-src
      - name: Checkout Windows shell source
        uses: actions/checkout@v4
        with:
          ref: work/windows-shell-plane
          path: shell-src
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build access temporary-access binary
        shell: pwsh
        working-directory: access-src
        run: cargo build --locked --release -p filament-cli --bin tunlion
      - name: Build Windows shell-relay binary
        shell: pwsh
        working-directory: shell-src
        run: cargo build --locked --release -p filament-cli --bin tunlion
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Stage files
        shell: pwsh
        run: |
          $stage = "packaging/windows-test/stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item access-src/target/release/tunlion.exe "$stage/tunlion.exe" -Force
          Copy-Item shell-src/target/release/tunlion.exe "$stage/tunlion-shell.exe" -Force
          Copy-Item packaging/windows-test/README.md "$stage/README.md" -Force
          Copy-Item packaging/windows-test/*.ps1 "$stage/"
      - name: Package
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc.Source "packaging/windows-test/tunlion-test.iss"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TunlionTestKitSetup
          path: packaging/windows-test/Output/TunlionTestKitSetup.exe
