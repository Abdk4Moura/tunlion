# Android builds of the CLI, for the Android app to wrap (docs/android-app-spec.md).
# Not a required check, so a trigger path filter is fine: a browser-only change
# never starts this workflow.
name: Android

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "cli/**"
      - "crates/**"
      - "lab/android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "crates/**"
      - "lab/android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: android build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: x86_64-linux-android
            abi: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          cargo install cargo-ndk --locked --version 4.1.2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: android-${{ matrix.target }}-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: android-${{ matrix.target }}-
      - name: Build
        working-directory: cli
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: cargo ndk --platform 26 -t ${{ matrix.abi }} build --release --locked --bin tunlion
      - name: Stage
        run: |
          mkdir -p out
          cp cli/target/${{ matrix.target }}/release/tunlion out/tunlion
          file out/tunlion
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: tunlion-${{ matrix.target }}
          path: out/tunlion
          if-no-files-found: error
