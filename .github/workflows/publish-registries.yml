name: publish-registries

# Publish filament-cli to crates.io and npm on a CLI release tag.
#
# Triggered by the `cli-v*` tag push directly (NOT workflow_run): OIDC Trusted
# Publishing rejects the workflow_run event, and both registries publish from
# source, so they don't need the built release assets. workflow_dispatch allows
# manual backfill (also OIDC-compatible).
#
# Auth: both via OIDC Trusted Publishing, no long-lived tokens.
#   crates.io: configure a Trusted Publisher for the `filament-cli` crate on
#              crates.io (crate Settings, Trusted Publishing) pointing at
#              Abdk4Moura/filament + publish-registries.yml.
#   npm:       configure a Trusted Publisher for `@abdk4moura/filament-cli` on
#              npmjs.com (package Settings, Trusted Publisher), same repo + workflow.

on:
  # Trigger on the tag push, NOT workflow_run: OIDC Trusted Publishing rejects the
  # workflow_run event for security. crates.io publishes from source and npm
  # publishes the package (the binary is fetched at install time), so neither
  # needs the release assets to exist yet. (winget, which does need the assets and
  # uses a PAT, stays on workflow_run in winget-publish.yml.)
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. cli-v0.5.0)"
        required: true

permissions:
  contents: read

jobs:
  crates-io:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for crates.io Trusted Publishing (no long-lived token)
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Update Rust toolchain (edition 2024)
        run: rustup update stable && rustup default stable
      - name: Authenticate to crates.io (Trusted Publishing / OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: cargo publish extracted crates (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          # filament-cli depends on 5 extracted path-crates, each version-pinned so
          # cargo resolves them by version on crates.io. They must be published
          # BEFORE filament-cli, in dependency order: the three leaves first
          # (secret-write, filament-pair, filament-cap), then the two that dep
          # secret-write (authkeys-managed, filament-id). Each authenticates via the
          # same OIDC token (a Trusted Publisher is configured per crate pointing at
          # Abdk4Moura/filament + publish-registries.yml).
          # --allow-dirty: the pinned-to-latest stable toolchain regenerates
          # Cargo.lock on checkout, which trips cargo publish's clean-tree check
          # even though the committed lock is valid.
          publish_crate() {
            name="$1"
            echo "::group::cargo publish $name"
            out=$(cd "crates/$name" && cargo publish --allow-dirty 2>&1) && { echo "$out"; echo "::endgroup::"; return 0; }
            echo "$out"
            if echo "$out" | grep -qiE "already (uploaded|exists)|crate version .* is already"; then
              echo "::notice::$name already on crates.io — nothing to do"; echo "::endgroup::"; return 0
            fi
            echo "::endgroup::"; echo "::error::cargo publish $name failed"; return 1
          }
          # cargo publish waits for index availability, but sleep between crates as
          # belt-and-suspenders so a dependent crate always sees its dep in the index.
          for c in secret-write filament-pair filament-cap authkeys-managed filament-id; do
            publish_crate "$c"
            sleep 5
          done
      - name: cargo publish filament-cli
        working-directory: cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          # The 5 extracted crates are published first (in dep order) by the step
          # above, so filament-cli's version-pinned path-deps resolve on crates.io.
          # --allow-dirty: the pinned-to-latest stable toolchain regenerates
          # Cargo.lock on checkout (format/re-resolve), which trips cargo
          # publish's clean-tree check even though the committed lock is valid.
          # Tolerate an already-published version (re-runs/backfills), but fail
          # loudly on any other error so it's visible.
          out=$(cargo publish --allow-dirty 2>&1) && { echo "$out"; exit 0; }
          echo "$out"
          if echo "$out" | grep -qiE "already (uploaded|exists)|crate version .* is already"; then
            echo "::notice::filament-cli $TAG already on crates.io — nothing to do"; exit 0
          fi
          echo "::error::cargo publish failed"; exit 1

  npm:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing (no long-lived token)
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Use an npm that supports Trusted Publishing (OIDC)
        run: npm install -g npm@latest
      - name: npm publish filament-cli (Trusted Publishing)
        working-directory: packaging/npm
        run: |
          set -euo pipefail
          # Validate the tag before it flows into `npm version`.
          echo "$TAG" | grep -qE '^cli-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' \
            || { echo "::error::unexpected tag format: '$TAG'"; exit 1; }
          version="${TAG#cli-v}"
          # Set the package version to the release version (source keeps 0.0.0).
          npm version "$version" --no-git-tag-version --allow-same-version
          # Trusted Publishing: npm authenticates via the OIDC id-token — no
          # NPM_TOKEN. Requires a Trusted Publisher for filament-cli configured on
          # npmjs.com pointing at this repo + workflow. Provenance is automatic.
          out=$(npm publish --access public 2>&1) && { echo "$out"; exit 0; }
          echo "$out"
          if echo "$out" | grep -qiE "cannot publish over|previously published|403 .*You cannot publish over"; then
            echo "::notice::filament-cli this version already on npm — nothing to do"; exit 0
          fi
          echo "::error::npm publish failed. Is the Trusted Publisher set on npmjs.com (@abdk4moura/filament-cli, Abdk4Moura/filament, publish-registries.yml) and the package seeded?"; exit 1
