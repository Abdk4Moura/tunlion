name: publish-registries

# Publish ONE package to crates.io (and, for the CLI, npm) per tag.
#
# Each package has its own tag namespace, and a tag publishes ONLY that package:
#   cli-v<ver>               -> filament-cli   (crates.io + npm)
#   filament-cap-v<ver>      -> filament-cap   (crates.io)
#   filament-id-v<ver>       -> filament-id    (crates.io)
#   filament-pair-v<ver>     -> filament-pair  (crates.io)
#   secret-write-v<ver>      -> secret-write   (crates.io)
#   authkeys-managed-v<ver>  -> authkeys-managed (crates.io)
#
# So bumping and releasing one crate does NOT attempt to publish the others. The
# CLI depends on the extracted crates by version, so when a dependency changes,
# publish IT first (push its <crate>-v<ver> tag) and THEN the CLI (cli-v<ver>);
# the CLI's publish resolves its dependencies from crates.io, it does not publish
# them.
#
# Auth: OIDC Trusted Publishing, no long-lived tokens. EACH crate needs its own
# Trusted Publisher configured on crates.io (crate Settings -> Trusted Publishing)
# pointing at Abdk4Moura/filament + publish-registries.yml (no environment). npm
# needs a Trusted Publisher for @abdk4moura/filament-cli on npmjs.com, same repo +
# workflow. A tag whose crate has no Trusted Publisher configured will fail the
# publish step with a 403 — configure it, then re-run.

on:
  push:
    tags:
      - "cli-v*"
      - "filament-cap-v*"
      - "filament-id-v*"
      - "filament-pair-v*"
      - "secret-write-v*"
      - "authkeys-managed-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. cli-v0.7.3 or filament-cap-v0.1.1)"
        required: true

permissions:
  contents: read

jobs:
  crates-io:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for crates.io Trusted Publishing (no long-lived token)
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Resolve which package this tag publishes
        id: pkg
        run: |
          set -euo pipefail
          tag="$TAG"
          # <prefix>-v<version>. `cli` maps to the filament-cli crate in cli/;
          # every other prefix is an extracted crate under crates/<name>.
          case "$tag" in
            cli-v*)              name="filament-cli";     dir="cli" ;;
            filament-cap-v*)     name="filament-cap";     dir="crates/filament-cap" ;;
            filament-id-v*)      name="filament-id";      dir="crates/filament-id" ;;
            filament-pair-v*)    name="filament-pair";    dir="crates/filament-pair" ;;
            secret-write-v*)     name="secret-write";     dir="crates/secret-write" ;;
            authkeys-managed-v*) name="authkeys-managed"; dir="crates/authkeys-managed" ;;
            *) echo "::error::tag '$tag' does not map to a known package"; exit 1 ;;
          esac
          # The tag version MUST match the crate's Cargo.toml version, so a tag can
          # never publish a mismatched version.
          tagver="${tag##*-v}"
          crtver=$(grep -m1 '^version' "$dir/Cargo.toml" | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$tagver" != "$crtver" ]; then
            echo "::error::tag version '$tagver' != $name Cargo.toml version '$crtver'"; exit 1
          fi
          echo "name=$name"   >> "$GITHUB_OUTPUT"
          echo "dir=$dir"     >> "$GITHUB_OUTPUT"
          echo "ver=$crtver"  >> "$GITHUB_OUTPUT"
      - name: Update Rust toolchain (edition 2024)
        run: rustup update stable && rustup default stable
      - name: Authenticate to crates.io (Trusted Publishing / OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: cargo publish ${{ steps.pkg.outputs.name }} ${{ steps.pkg.outputs.ver }}
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          NAME: ${{ steps.pkg.outputs.name }}
          VER: ${{ steps.pkg.outputs.ver }}
        run: |
          set -euo pipefail
          # Idempotent: if this exact version is already on crates.io (a re-run or
          # backfill), do nothing. --allow-dirty: the pinned-to-latest stable
          # toolchain regenerates Cargo.lock on checkout, tripping the clean-tree
          # check even though the committed lock is valid.
          if curl -fsS -A "filament-ci (release)" "https://crates.io/api/v1/crates/$NAME/$VER" >/dev/null 2>&1; then
            echo "::notice::$NAME $VER already on crates.io — nothing to do"; exit 0
          fi
          out=$(cargo publish --allow-dirty 2>&1) && { echo "$out"; exit 0; }
          echo "$out"
          if echo "$out" | grep -qiE "already (uploaded|exists)|crate version .* is already"; then
            echo "::notice::$NAME $VER already on crates.io — nothing to do"; exit 0
          fi
          echo "::error::cargo publish $NAME failed (is a Trusted Publisher configured for the '$NAME' crate on crates.io?)"; exit 1

  npm:
    # Only the CLI has an npm package.
    if: >
      startsWith(github.ref, 'refs/tags/cli-v') ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'cli-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing (no long-lived token)
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Use an npm that supports Trusted Publishing (OIDC)
        run: npm install -g npm@latest
      - name: npm publish filament-cli (Trusted Publishing)
        working-directory: packaging/npm
        run: |
          set -euo pipefail
          # Validate the tag before it flows into `npm version`.
          echo "$TAG" | grep -qE '^cli-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' \
            || { echo "::error::unexpected tag format: '$TAG'"; exit 1; }
          version="${TAG#cli-v}"
          # Set the package version to the release version (source keeps 0.0.0).
          npm version "$version" --no-git-tag-version --allow-same-version
          # Trusted Publishing: npm authenticates via the OIDC id-token — no
          # NPM_TOKEN. Requires a Trusted Publisher for filament-cli configured on
          # npmjs.com pointing at this repo + workflow. Provenance is automatic.
          out=$(npm publish --access public 2>&1) && { echo "$out"; exit 0; }
          echo "$out"
          if echo "$out" | grep -qiE "cannot publish over|previously published|403 .*You cannot publish over"; then
            echo "::notice::filament-cli this version already on npm — nothing to do"; exit 0
          fi
          echo "::error::npm publish failed. Is the Trusted Publisher set on npmjs.com (@abdk4moura/filament-cli, Abdk4Moura/filament, publish-registries.yml) and the package seeded?"; exit 1
