name: publish-registries

# Publish filament-cli to crates.io and npm after a CLI release is built.
#
# Triggered by cli-release.yml COMPLETING (workflow_run) — NOT the `release`
# event, because a release created by GITHUB_TOKEN does not fire `release`
# workflows (GitHub recursion guard). workflow_dispatch allows manual backfill.
#
# Auth:
#   crates.io — CARGO_REGISTRY_TOKEN secret (Account Settings → API Tokens)
#   npm       — Trusted Publishing via OIDC (no token). Configure a Trusted
#               Publisher for `filament-cli` on npmjs.com pointing at this repo
#               and workflow (Abdk4Moura/filament → publish-registries.yml).

on:
  workflow_run:
    workflows: ["cli-release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. cli-v0.4.2)"
        required: true

permissions:
  contents: read

jobs:
  crates-io:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'cli-v'))
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
      - name: Update Rust toolchain (edition 2024)
        run: rustup update stable && rustup default stable
      - name: cargo publish filament-cli
        working-directory: cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN not set — skipping crates.io publish."
            exit 0
          fi
          # pake is inlined, so filament-cli has no unpublished path-deps.
          # Tolerate an already-published version (re-runs/backfills), but fail
          # loudly on any other error so it's visible.
          out=$(cargo publish 2>&1) && { echo "$out"; exit 0; }
          echo "$out"
          if echo "$out" | grep -qiE "already (uploaded|exists)|crate version .* is already"; then
            echo "::notice::filament-cli $TAG already on crates.io — nothing to do"; exit 0
          fi
          echo "::error::cargo publish failed"; exit 1

  npm:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'cli-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing (no long-lived token)
    env:
      TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Use an npm that supports Trusted Publishing (OIDC)
        run: npm install -g npm@latest
      - name: npm publish filament-cli (Trusted Publishing)
        working-directory: packaging/npm
        run: |
          set -euo pipefail
          # Validate the tag before it flows into `npm version`.
          echo "$TAG" | grep -qE '^cli-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' \
            || { echo "::error::unexpected tag format: '$TAG'"; exit 1; }
          version="${TAG#cli-v}"
          # Set the package version to the release version (source keeps 0.0.0).
          npm version "$version" --no-git-tag-version --allow-same-version
          # Trusted Publishing: npm authenticates via the OIDC id-token — no
          # NPM_TOKEN. Requires a Trusted Publisher for filament-cli configured on
          # npmjs.com pointing at this repo + workflow. Provenance is automatic.
          out=$(npm publish --access public 2>&1) && { echo "$out"; exit 0; }
          echo "$out"
          if echo "$out" | grep -qiE "cannot publish over|previously published|403 .*You cannot publish over"; then
            echo "::notice::filament-cli this version already on npm — nothing to do"; exit 0
          fi
          echo "::error::npm publish failed — is the Trusted Publisher set on npmjs.com (filament-cli -> Abdk4Moura/filament -> publish-registries.yml) and the package seeded?"; exit 1
