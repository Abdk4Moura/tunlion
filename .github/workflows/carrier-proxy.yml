# Proxy-only network profile for the carriers (docs/carriers.md, section 10).
#
# Runs cli/tests/carrier-proxy-gates.sh: a real CLI inside a network namespace
# whose only egress is an authenticating squid (CONNECT to 443 and the
# signaling port only) joins, sends to and runs exec on a CLI on the host,
# against a local signaling backend and a local coturn. Nothing touches
# production; no secret is configured here.
name: Carrier proxy gates

on:
  pull_request:
    paths:
      - 'crates/filament-carrier/**'
      - 'crates/filament-signal/src/**'
      - 'crates/filament-transport/src/turn_bridge.rs'
      - 'crates/filament-transport/src/net.rs'
      - 'cli/src/doctor.rs'
      - 'cli/src/exit_codes.rs'
      - 'cli/tests/carrier-proxy-gates.sh'
      - '.github/workflows/carrier-proxy.yml'
  workflow_dispatch: {}

concurrency:
  group: carrier-proxy-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"

jobs:
  carrier-proxy:
    name: carrier proxy gates (ubuntu, netns, squid, coturn)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Fall back to uncached builds if the cache backend is down
        shell: bash
        run: |
          if ! sccache --start-server >/dev/null 2>&1 && ! sccache --show-stats >/dev/null 2>&1; then
            echo "::warning::sccache unavailable; building without it"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Install squid and coturn
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq squid coturn
          sudo systemctl stop squid coturn 2>/dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend dependencies
        run: python -m pip install -q -r backend/requirements.txt

      - name: Carrier unit tests
        run: cargo test -p filament-carrier

      - name: Build the CLI
        run: cargo build --release -p filament-cli --bin tunlion

      - name: Proxy-only gates
        env:
          TUNLION_TEST_VENV: python
          CARRIER_GATE_EVIDENCE: ${{ runner.temp }}/carrier-proxy-evidence
        run: TUNLION_BIN=target/release/tunlion bash cli/tests/carrier-proxy-gates.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrier-proxy-evidence
          path: ${{ runner.temp }}/carrier-proxy-evidence
          if-no-files-found: warn
