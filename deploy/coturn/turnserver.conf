# Tunlion coturn — STUN + TURN.
# Dynamic values (static-auth-secret, realm, external-ip) are injected by
# docker-compose from .env, so they are NOT set here.

listening-port=3478
# TLS-TURN (turns:) on 443 — looks like HTTPS, survives networks that throttle
# or RST plain TURN. 443 is freed from the plain aux-server in docker-compose.
tls-listening-port=443

fingerprint

# Time-limited credentials: the API mints username=<expiry> + HMAC(secret) per
# session (config.py _turn_servers). This must stay on and the secret must match
# FIL_TURN_SECRET handed to the API.
use-auth-secret

# Relay port range. Every WebRTC session can reserve a relay port when it is
# set up, even if a direct path then wins, so a narrow range runs out: 41 ports
# (49160-49200) were all taken during the 0.9.0 launch matrix, and forced-relay
# connections then failed with "no available ports". Use the IANA dynamic range.
#
# Firewall: allow inbound UDP 49152-65535 to this host, e.g.
#   ufw allow 49152:65535/udp
# or the equivalent cloud firewall rule. Restart coturn after changing this.
min-port=49152
max-port=65535

# Hardening
no-multicast-peers
no-cli
no-tcp-relay
stale-nonce=600
user-quota=12
total-quota=1200

# Log to stdout so `docker compose logs coturn` shows activity.
log-file=stdout

# turns: cert — Let's Encrypt for turn.filament.autumated.com, installed +
# auto-renewed by acme.sh (--install-cert reloadcmd restarts coturn).
cert=/etc/coturn/cert.pem
pkey=/etc/coturn/pkey.pem
