# filament-peerloop -- the peer loop's engine: connection state and the policy
# over it, moved out of cli/src (issue #465, slice 3).
#
# `Conn`, `Link` and the modules they own (resilience, link_manager, local,
# holepunch, identity) live here. What is NOT here is the command surface
# (`send_cmd`, `recv_cmd`, the daemons, the roster UI): those decide what a person
# asked for and render it. The terminal and the machine's own facts arrive
# through the injected `host::LogSink` and `host::HostServices`; the CLI
# implements both and keeps thin re-export shims under the old module paths.
#
# This crate never calls back into the CLI, so there is no cycle.
[package]
name = "filament-peerloop"
version = "0.1.0"
authors = ["Abdk4Moura <pro.kaiserlautern@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Abdk4Moura/tunlion"
description = "The peer loop's engine: connection state, warm-hold, liveness, adoption and the petname rule"
readme = "README.md"
keywords = ["p2p", "peer", "warm-hold", "liveness", "policy"]
categories = ["network-programming"]

[features]
# Compatibility: existing consumers, including the CLI, keep the mesh API.
default = ["mesh", "mount-server", "forward-server", "dispatch", "fleet", "exec-server"]
mesh = ["dep:filament-overlay"]
# The receive dispatch loop and its host capability traits. Default-on for the
# CLI; a reduced consumer that only wants the mechanics can omit it.
dispatch = []
# Fleet admission and the fleet-hello arm. Optional so a dispatch-only build
# (no overlay, no wireless routing) compiles on reduced targets.
fleet = ["dep:filament-fleet"]
# Inbound filesystem serving is opt-out for existing consumers, but absent from
# reduced engine profiles. The wire/control vocabulary remains available.
mount-server = []
# Inbound local forward serving: accept an `l2-open` and dial the peer's
# requested local socket. Reduced engine profiles omit it so no local dial
# implementation compiles; the wire vocabulary and the admission policy stay
# common, and a forward open is refused honestly.
forward-server = []
# Inbound `exec-open` serving: argv-exact direct spawn, separate stdout/stderr
# stream pumps, heartbeat/revocation cancellation. The protocol lives in the
# library behind this feature; the host supplies a process primitive only.
# It implies `dispatch` because the module imports `recv::dispatch`. A profile
# that explicitly omits defaults compiles no process backend, and a well-formed
# L2-half open gets a named refusal. Default builds (including the Android CLI
# release unless it opts out of defaults) do compile the exec backend.
exec-server = ["dispatch"]
# Fault-injection hooks the peer-loop paths read. The CLI forwards its own
# `test-hooks` feature here, so a gate build injects into the moved code too.
test-hooks = []
debug-logs = []

[dependencies]
# Versions copied verbatim from cli/Cargo.toml, so the dependency graph and
# behaviour match the CLI build these modules came from.
anyhow = "1.0.102"
authkeys-managed = { path = "../authkeys-managed", version = "0.1.2" }
async-trait = "0.1.89"
# The mount protocol's path encoding: raw unix bytes, lossy UTF-8 elsewhere.
base64 = "0.22"
bytes = "1.11.1"
chrono = "0.4"
filament-cap = { path = "../filament-cap", version = "0.1.1" }
filament-fleet = { path = "../filament-fleet", version = "0.1.0", optional = true }
filament-id = { path = "../filament-id", version = "0.1.0" }
filament-pair = { path = "../filament-pair", version = "0.1.0" }
filament-overlay = { path = "../filament-overlay", version = "0.1.0", optional = true }
# The pure transfer wire vocabulary + ceremony decisions. `recv::verify_incoming`
# returns `VerifyResult` and calls `decide_verify`, so the receive verify is the
# same decision the CLI always made, from the one crate that owns it.
filament-proto = { path = "../filament-proto", version = "0.1.0" }
filament-signal = { path = "../filament-signal", version = "0.1.0" }
filament-transfer = { path = "../filament-transfer", version = "0.1.0" }
filament-transport = { path = "../filament-transport", version = "0.1.0" }
ring = "0.17"
getrandom = "0.2"
# The same owner-only atomic writer the CLI's store used. The store module's
# root is explicit; this crate only needs the byte-identical write primitive.
secret-write = { path = "../secret-write", version = "0.1.3" }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
hex = "0.4"
tokio = { version = "1.52.3", features = ["full"] }
webrtc = "0.17.1"

# The mount server's directory-relative ("*at") calls are POSIX; the non-unix
# arm is std-only (Windows mounts go through WinFsp). Same version as the CLI.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The receive `.part` open refuses a reparse point (symlink/junction) by reading
# the handle's attributes, exactly as the CLI's copy did. Same pinned version and
# features as the CLI, so the moved code compiles here unchanged.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_IO"] }

[dev-dependencies]
# The moved tests: a fake signaling websocket (ring) and capability-store JSON
# fixtures keyed by hex device keys.
ring = "0.17"
hex = "0.4"
