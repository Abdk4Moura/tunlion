# filament-peerloop -- the peer loop's engine: connection state and the policy
# over it, moved out of cli/src (issue #465, slice 3).
#
# `Conn`, `Link` and the modules they own (resilience, link_manager, local,
# holepunch, identity) live here. What is NOT here is the command surface
# (`send_cmd`, `recv_cmd`, the daemons, the roster UI): those decide what a person
# asked for and render it. The terminal and the machine's own facts arrive
# through the injected `host::LogSink` and `host::HostServices`; the CLI
# implements both and keeps thin re-export shims under the old module paths.
#
# This crate never calls back into the CLI, so there is no cycle.
[package]
name = "filament-peerloop"
version = "0.1.0"
authors = ["Abdk4Moura <pro.kaiserlautern@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Abdk4Moura/tunlion"
description = "The peer loop's engine: connection state, warm-hold, liveness, adoption and the petname rule"
readme = "README.md"
keywords = ["p2p", "peer", "warm-hold", "liveness", "policy"]
categories = ["network-programming"]

[features]
# Fault-injection hooks the peer-loop paths read. The CLI forwards its own
# `test-hooks` feature here, so a gate build injects into the moved code too.
test-hooks = []
debug-logs = []

[dependencies]
# Versions copied verbatim from cli/Cargo.toml, so the dependency graph and
# behaviour match the CLI build these modules came from.
anyhow = "1.0.102"
async-trait = "0.1.89"
filament-cap = { path = "../filament-cap", version = "0.1.1" }
filament-id = { path = "../filament-id", version = "0.1.0" }
filament-signal = { path = "../filament-signal", version = "0.1.0" }
filament-transport = { path = "../filament-transport", version = "0.1.0" }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
webrtc = "0.17.1"

[dev-dependencies]
# The moved tests: a fake signaling websocket (base64/ring) and the frozen
# punch literal digest (sha2).
base64 = "0.22"
ring = "0.17"
sha2 = "0.11.0"
