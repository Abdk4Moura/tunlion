[package]
name = "tunlion-signal"
version = "0.1.0"
authors = ["Abdk4Moura <pro.kaiserlautern@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/Abdk4Moura/tunlion"
readme = "README.md"
keywords = ["socketio", "engineio", "websocket", "signaling", "rustls"]
categories = ["network-programming"]
description = "Minimal Engine.IO v4 / Socket.IO v5 websocket client for tunlion's signaling, on rustls."

# Published as tunlion-signal. The Rust library keeps its pre-rename name, so no
# `use` line changed.
[lib]
name = "filament_signal"

[dependencies]
anyhow = "1.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "net", "io-util"] }
# rustls, deliberately: replacing rust_socketio's hard native-tls dependency is
# the entire point of this crate, so the binary does not link system
# libssl/libcrypto. The connector is always built by `tls::client_config()`;
# tungstenite's own root feature is only what its rustls backend requires.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Trust for tunlion's servers (src/tls.rs): the Mozilla roots are Android's
# store and the fallback where a Unix machine has no system store at all.
webpki-roots = "1"

# The OS trust store everywhere but Android (see src/tls.rs). Pure Rust on
# Linux, so the static musl build is unaffected.
[target.'cfg(not(target_os = "android"))'.dependencies]
rustls-platform-verifier = "0.7.0"

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }
# Server-side local websocket fixtures only; production stays connect-only.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
# The TLS side of the private-CA signaling fixture (src/tls_trust_tests.rs).
tokio-rustls = { version = "0.26.4", default-features = false }
