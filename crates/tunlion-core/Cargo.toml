# tunlion-core — the library the Android app calls. It owns a reduced receive
# engine over an explicit config dir. See docs/android-ffi.md.
[package]
name = "tunlion-core"
version = "0.1.0"
authors = ["Abdk4Moura <pro.kaiserlautern@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Abdk4Moura/tunlion"
description = "tunlion as a library. Android is one caller, not the only one."
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

# Binding generation only. `cargo run --features cli --bin uniffi-bindgen`.
# Off by default so the shipped cdylib does not carry the bindgen tree.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli", "uniffi/cargo-metadata"]
# Desktop/full composition only. The Android reduced profile leaves this off so
# mesh, overlay and fleet code are absent from the shipped graph.
fleet = ["filament-peerloop/fleet", "filament-peerloop/mesh"]

[dependencies]
filament-id = { path = "../filament-id", version = "0.1.2" }
# The engine runtime the library owns. Reduced profile on purpose: an Android
# library compiles no mount/forward/mesh server sectors it does not serve.
filament-peerloop = { path = "../filament-peerloop", version = "0.1.0", default-features = false, features = ["dispatch"] }
secret-write = { path = "../secret-write", version = "0.1.3" }
filament-cap = { path = "../filament-cap", version = "0.1.1" }
filament-transport = { path = "../filament-transport", version = "0.1.0" }
filament-signal = { path = "../filament-signal", version = "0.1.0" }
async-trait = "0.1.89"
serde_json = "1.0.150"
hex = "0.4"
anyhow = "1.0.102"
thiserror = "2.0.21"
# Cargo metadata discovery belongs to bindgen, not the Android library.
uniffi = { version = "0.32.2", default-features = false }
# Instance-owned runtime + the engine's watch/join primitives. Types do not
# cross the UniFFI boundary; the runtime lives inside `Core`.
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "sync", "time", "net"] }

[dev-dependencies]
tempfile = "3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
# `#[tokio::test]` only; the shipped cdylib does not enable the test macros.
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
