# filament-fleet — same-owner auto-mesh, carved out of the CLI.
#
# Devices certified by ONE owner key meet on a rendezvous channel and admit each
# other on that CERTIFICATE, never on presence. Anyone who learns the channel id
# can see that devices are there; nobody is admitted without an owner-signed cert
# bound to a live possession proof over the link's channel binding.
#
# PARTIAL carve, same rule as filament-cap. What lives here is the ceremony and
# the conversation: build a hello, verify a hello, and the per-peer state machine
# that tracks who has been challenged, who proved themselves, who proved to be
# somebody else, and who ran out of time. The CLI keeps what touches this machine:
# the rendezvous secret on disk, the owner key in the keystore, and loading this
# device's own certificate.
#
# NO I/O in here at all. `greet` and `on_control` return an Action/Outcome that
# the caller sends, and building our own hello is INJECTED as a closure, because
# that needs host state. Same shape as filament-id taking a &dyn KeyStore.
[package]
name = "filament-fleet"
version = "0.1.0"
authors = ["Abdk4Moura <pro.kaiserlautern@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Abdk4Moura/filament"
description = "Same-owner device auto-mesh: certificate-based admission with per-link possession proofs"
readme = "README.md"
keywords = ["mesh", "fleet", "certificate", "admission", "p2p"]
categories = ["network-programming", "cryptography"]

[dependencies]
anyhow = "1.0.102"
serde_json = "1.0.150"
filament-id = { path = "../filament-id", version = "0.1.2" }
filament-overlay = { path = "../filament-overlay", version = "0.1.0" }
